[env:m5stack-core2]
platform = espressif32
board = m5stack-core2
framework = arduino
build_flags =
  -DBOARD_HAS_PSRAM
  ; エクスポートした方策ヘッダ (firmware/policy_*.h) を探せるようにする
  -I${PROJECT_DIR}/..
  ; 載せる方策。crawl / selfright / forward
  -DGORON_POLICY=\"policy_crawl.h\"
; 既定の921600だとこのリンクでは書き込みが頻繁に転ける（serial noise）
upload_speed = 115200
monitor_speed = 115200
lib_deps =
  m5stack/M5Unified@^0.2.5
  robotis-git/Dynamixel2Arduino@^0.8.0
